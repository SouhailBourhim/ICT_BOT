name: RAG System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-html pytest-xdist pytest-timeout
        pip install flake8 mypy bandit
    
    - name: Create test directories
      run: |
        mkdir -p test_reports
        mkdir -p logs
    
    - name: Run code quality checks
      run: |
        # Style checking with flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        
        # Type checking with mypy (non-blocking)
        mypy . --ignore-missing-imports || true
        
        # Security checking with bandit (non-blocking)
        bandit -r . -x .venv,venv,tests -f json -o test_reports/bandit_report.json || true
    
    - name: Run smoke tests
      run: |
        python run_tests.py --type smoke --ci
    
    - name: Run unit tests
      run: |
        python run_tests.py --type unit --ci
    
    - name: Run integration tests
      run: |
        python run_tests.py --type integration --ci
    
    - name: Run performance tests
      if: matrix.python-version == '3.10'  # Only run on one Python version
      run: |
        python run_tests.py --type performance --ci
    
    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.python-version }}
        path: test_reports/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.10'
      with:
        file: ./test_reports/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  load-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout
    
    - name: Run load tests
      run: |
        python run_tests.py --type load --ci
    
    - name: Upload load test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: load-test-reports
        path: test_reports/

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme
    
    - name: Generate documentation
      run: |
        # Generate API documentation
        sphinx-apidoc -o docs/source .
        sphinx-build -b html docs/source docs/build
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build

  notify:
    runs-on: ubuntu-latest
    needs: [test, load-test, security-scan]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.test.result == 'success' && needs.load-test.result == 'success'
      run: |
        echo "All tests passed successfully!"
        # Add notification logic here (Slack, email, etc.)
    
    - name: Notify on failure
      if: needs.test.result == 'failure' || needs.load-test.result == 'failure'
      run: |
        echo "Tests failed! Check the logs for details."
        # Add notification logic here (Slack, email, etc.)
        exit 1